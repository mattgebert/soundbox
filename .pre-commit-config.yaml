minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=5000

      - id: check-case-conflict

      - id: check-merge-conflict

      - id: check-json

      - id: check-toml

      - id: check-yaml

      - id: detect-private-key

      - id: end-of-file-fixer
        exclude: ^(CHANGELOG\.md|public/music/)

      - id: trailing-whitespace
        exclude: ^(CHANGELOG\.md|public/music/)

      - id: mixed-line-ending
        args:
          - --fix=lf

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --exit-non-zero-on-fix

      - id: ruff-format
        args:
          - --line-length=88

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm exec -- prettier --write
        language: system
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - yaml
          - markdown
          - css
        exclude: ^(CHANGELOG\.md|package-lock\.json|public/music/)

      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
        types_or:
          - javascript
          - jsx
          - ts
          - tsx

      - id: typescript
        name: TypeScript
        entry: npm run typecheck
        language: system
        pass_filenames: false
        types_or:
          - ts
          - tsx

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg
      - id: commitizen-branch
        stages:
          - pre-push
