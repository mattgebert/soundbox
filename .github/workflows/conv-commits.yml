name: Conventional Commits Validation
description: This workflow validates the commit messages in a pull request.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: conv-commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commit validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: python -m pip install commitizen

      - name: Validate pull-request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "${BASE_SHA}..${HEAD_SHA}"
