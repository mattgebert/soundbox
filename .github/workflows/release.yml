name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundbox-release
  cancel-in-progress: false

jobs:
  verify:
    # Use ci.yml workflow to verify the code before releasing
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump version and publish release
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: python -m pip install commitizen

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        run: cz bump --yes --changelog

      - name: Push release commit and tag
        run: git push --follow-tags origin main

      - name: Read released version
        id: version
        shell: bash
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --generate-notes \
            --title "Soundbox v${VERSION}"
