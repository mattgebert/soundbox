name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundbox-release
  cancel-in-progress: false

jobs:
  verify:
    # Use ci.yml workflow to verify the code before releasing
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump version and publish release
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: python -m pip install commitizen

      # ------------------------------------------------------------
      # RELEASE GATE
      # Validate exactly the commits that are about to be released.
      # ------------------------------------------------------------

      - name: Find previous release
        id: previous
        shell: bash
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0)"
          echo "tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${PREVIOUS_TAG}"

      - name: Validate commits since previous release
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          echo "Validating ${PREVIOUS_TAG}..HEAD"
          cz check --rev-range "${PREVIOUS_TAG}..HEAD"

      # ------------------------------------------------------------
      # RELEASE
      # ------------------------------------------------------------

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        run: cz bump --yes --changelog

      - name: Read released version
        id: version
        shell: bash
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          awk -v version="$VERSION" '
            BEGIN { found = 0 }

            /^## / {
              if (found) {
                exit
              }

              if ($0 ~ "^## v?" version "([ (]|$)") {
                found = 1
                next
              }
            }

            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::Could not extract release notes for version ${VERSION}"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Push release commit and tag
        run: git push --follow-tags origin main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "Soundbox v${VERSION}" \
            --notes-file release-notes.md
