[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".git",
    ".venv",
    "dist",
    "node_modules",
    "public/music",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
